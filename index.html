<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo | ContaCore EMCO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800/90 border border-slate-700/80 rounded-2xl shadow-2xl p-8 backdrop-blur-sm">
    
    <div class="text-center space-y-2 mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 mb-2">
        <i class="ph-bold ph-shield-check text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">ContaCore EMCO</h1>
      <p class="text-xs text-slate-400 font-mono tracking-wide uppercase">Control de Acceso & Gobernanza</p>
    </div>

    <div id="alert-box" class="hidden p-3.5 mb-6 rounded-xl text-xs font-medium border flex items-start gap-2.5">
      <i id="alert-icon" class="ph-bold text-base shrink-0 mt-0.5"></i>
      <span id="alert-msg"></span>
    </div>

    <form id="form-login" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-semibold uppercase text-slate-300 mb-1.5">Correo Corporativo</label>
        <div class="relative">
          <i class="ph ph-envelope-simple absolute left-3.5 top-3 text-slate-400 text-lg"></i>
          <input 
            type="email" 
            id="email" 
            required 
            placeholder="usuario@emco.com" 
            class="w-full pl-10 pr-4 py-2.5 bg-slate-900/60 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
          >
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold uppercase text-slate-300 mb-1.5">Contraseña</label>
        <div class="relative">
          <i class="ph ph-lock-key absolute left-3.5 top-3 text-slate-400 text-lg"></i>
          <input 
            type="password" 
            id="password" 
            required 
            placeholder="••••••••••••" 
            class="w-full pl-10 pr-10 py-2.5 bg-slate-900/60 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
          >
          <button 
            type="button" 
            id="toggle-pwd" 
            class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-200 transition"
            title="Mostrar/ocultar contraseña"
          >
            <i class="ph ph-eye" id="toggle-pwd-icon"></i>
          </button>
        </div>
      </div>

      <button 
        type="submit" 
        id="btn-login" 
        class="w-full mt-2 py-3 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-600/20 transition flex items-center justify-center gap-2"
      >
        <span>Ingresar al Sistema</span>
        <i class="ph-bold ph-arrow-right"></i>
      </button>
    </form>

    <div class="mt-8 pt-4 border-t border-slate-700/60 text-center">
      <p class="text-[11px] text-slate-500 font-mono">
        Sesión protegida bajo auditoría centralizada. Todas las operaciones quedan registradas.
      </p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      collection, 
      addDoc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDg3sOINhPnnBsNQVkIFweGA0dTHTqTGeM",
      authDomain: "contabilidad-general-hr-emco.firebaseapp.com",
      projectId: "contabilidad-general-hr-emco",
      storageBucket: "contabilidad-general-hr-emco.firebasestorage.app",
      messagingSenderId: "392195682754",
      appId: "1:392195682754:web:b8407240ba61caa1cb265b",
      measurementId: "G-28RS9BPBYG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const alertBox = document.getElementById("alert-box");
    const alertMsg = document.getElementById("alert-msg");
    const alertIcon = document.getElementById("alert-icon");

    function showAlert(message, type = "error") {
      alertBox.classList.remove("hidden", "bg-rose-950/50", "border-rose-800", "text-rose-200", "bg-amber-950/50", "border-amber-800", "text-amber-200");
      if (type === "error") {
        alertBox.classList.add("bg-rose-950/50", "border-rose-800", "text-rose-200");
        alertIcon.className = "ph-bold ph-warning-circle text-rose-400 text-base shrink-0 mt-0.5";
      } else {
        alertBox.classList.add("bg-amber-950/50", "border-amber-800", "text-amber-200");
        alertIcon.className = "ph-bold ph-shield-warning text-amber-400 text-base shrink-0 mt-0.5";
      }
      alertMsg.innerText = message;
    }

    function clearAlert() {
      alertBox.classList.add("hidden");
      alertMsg.innerText = "";
    }

    const toggleBtn = document.getElementById("toggle-pwd");
    const pwdInput = document.getElementById("password");
    const pwdIcon = document.getElementById("toggle-pwd-icon");
    toggleBtn.addEventListener("click", () => {
      const isPassword = pwdInput.type === "password";
      pwdInput.type = isPassword ? "text" : "password";
      pwdIcon.className = isPassword ? "ph ph-eye-slash" : "ph ph-eye";
    });

    async function logAuthAttempt(action, email, uid = null, details = {}) {
      try {
        await addDoc(collection(db, "audit_logs"), {
          actor_uid: uid || "UNAUTHENTICATED",
          actor_email: email,
          action,
          module: "GOVERNANCE",
          details,
          timestamp: serverTimestamp()
        });
      } catch (err) {
        console.error("Fallo al escribir auditoría:", err);
      }
    }

    const form = document.getElementById("form-login");
    const btnLogin = document.getElementById("btn-login");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert();

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = pwdInput.value;

      btnLogin.disabled = true;
      btnLogin.innerHTML = `<i class="ph ph-spinner animate-spin text-lg"></i> <span>Verificando credenciales...</span>`;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        const staffRef = doc(db, "staff_users", user.uid);
        const staffDoc = await getDoc(staffRef);

        if (!staffDoc.exists()) {
          await logAuthAttempt("LOGIN_BLOCKED_NOT_IN_STAFF", email, user.uid, { reason: "Sin perfil en staff_users" });
          await signOut(auth);
          showAlert("Acceso restringido: Esta cuenta no está dada de alta en el personal autorizado.", "error");
          return;
        }

        const staffData = staffDoc.data();

        if (staffData.status !== "ACTIVE") {
          await logAuthAttempt("LOGIN_BLOCKED_INACTIVE", email, user.uid, { current_status: staffData.status });
          await signOut(auth);
          showAlert(`Acceso denegado: Usuario en estado "${staffData.status || 'SUSPENDIDO'}".`, "warning");
          return;
        }

        await logAuthAttempt("LOGIN_SUCCESS", email, user.uid, { role_id: staffData.role_id });
        
        sessionStorage.setItem("active_user_name", staffData.full_name || user.email);
        sessionStorage.setItem("active_user_role", staffData.role_id || "GUEST");

        // REDIRECCIÓN HACIA EL MÓDULO GENERAL
        window.location.href = "modulo_general.html";

      } catch (error) {
        let errorMsg = "Ocurrió un error al intentar iniciar sesión.";
        if (error.code === "auth/invalid-credential" || error.code === "auth/user-not-found" || error.code === "auth/wrong-password") {
          errorMsg = "Credenciales incorrectas. Verifique correo y contraseña.";
        } else if (error.code === "auth/too-many-requests") {
          errorMsg = "Demasiados intentos fallidos. Intente nuevamente en unos minutos.";
        }
        showAlert(errorMsg, "error");
      } finally {
        btnLogin.disabled = false;
        btnLogin.innerHTML = `<span>Ingresar al Sistema</span> <i class="ph-bold ph-arrow-right"></i>`;
      }
    });
  </script>
</body>
</html>
